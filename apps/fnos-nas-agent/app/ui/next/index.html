<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>fnos-nas-agent</title>
<link rel="stylesheet" href="/next/styles.css">
<script>
/* 引导诊断（Phase 225b）：模块加载或执行失败时，把静默失败变成可见错误。 */
(function(){
  "use strict";
  var failed = [];
  function text(){
    return "界面引导失败：" + failed.slice(0, 3).join("；") +
      "。自查：① 浏览器是否为较新版本（Chrome/Edge 90+ 或 Safari 14+）；" +
      "② 是否通过 http://NAS-IP:18787 直连（子路径反向代理需要额外适配）；" +
      "③ 服务端是否已更新到包含 /next 的版本（可 curl /next/js/main.js 看 HTTP 状态）。";
  }
  function show(){
    var host = document.getElementById("boot-diagnostic");
    if(host && failed.length){ host.hidden = false; host.textContent = text(); }
  }
  window.addEventListener("error", function(e){
    if(e.target && e.target.src) failed.push("资源加载失败：" + e.target.src);
    else failed.push((e.message || "脚本错误") + (e.lineno ? "（第 " + e.lineno + " 行）" : ""));
    show();
  }, true);
  window.addEventListener("unhandledrejection", function(e){
    failed.push("Promise 拒绝：" + ((e.reason && e.reason.message) || e.reason || "未知"));
    show();
  });
  setTimeout(function(){
    if(!document.documentElement.getAttribute("data-ui2-boot")) show();
  }, 5000);
})();
</script>
<link rel="icon" href="/next/favicon.svg">
</head>
<body class="app">
<a class="skip-link" href="#main">跳到主要内容</a>
<div id="boot-diagnostic" class="banner banner--danger" role="alert" hidden
     style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;max-width:92vw"></div>
<div class="toast-host" id="toast-host"></div>
<div class="modal-host" id="modal-host"></div>

<header class="app-header">
  <button class="btn btn--ghost btn--sm btn--icon-only" id="nav-toggle" aria-label="切换导航" hidden>☰</button>
  <div class="brand"><span class="brand-mark">🛰️</span><b>fnos-nas-agent</b><span class="badge badge--env" id="env-badge" hidden></span></div>
  <div class="app-header__spacer"></div>
  <button class="btn btn--ghost btn--sm btn--icon-only" id="btn-refresh" title="刷新当前页（R）">⟳</button>
  <button class="btn btn--ghost btn--sm btn--icon-only" id="btn-theme" title="切换主题">🌗</button>
  <button class="btn btn--ghost btn--sm" id="btn-logout" hidden>退出登录</button>
</header>

<div class="app-body">
  <nav class="nav-rail" id="nav-rail" aria-label="主导航"></nav>
  <main class="app-main" id="main" tabindex="-1">
    <div class="page-head">
      <h1 class="page-head__title" id="page-title">加载中…</h1>
      <p class="page-head__sub muted" id="page-sub"></p>
    </div>
    <div id="page-root" aria-live="polite"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="快捷导航" hidden></nav>

<section class="auth-layer" id="auth-layer" hidden>
  <div class="card auth-card">
    <div class="auth-card__brand"><span class="brand-mark">🛰️</span><b>fnos-nas-agent</b></div>
    <p class="muted auth-card__hint">轻量、安全优先的飞牛 fnOS NAS 智能助手。</p>

    <form id="form-setup" hidden autocomplete="off">
      <h2 class="auth-card__title">初始化设置</h2>
      <p class="field__hint">首次使用需设置管理密码；只保存加盐 scrypt 哈希，不保存明文。</p>
      <div class="field"><label class="field__label" for="setup-password">管理密码（10–128 位）</label>
        <input class="input" id="setup-password" type="password" minlength="10" maxlength="128" required></div>
      <div class="field"><label class="field__label" for="setup-password2">确认密码</label>
        <input class="input" id="setup-password2" type="password" minlength="10" maxlength="128" required></div>
      <div class="field" id="setup-code-field" hidden><label class="field__label" for="setup-code">安装码</label>
        <input class="input" id="setup-code" maxlength="64" autocomplete="one-time-code">
        <p class="field__hint">服务端启用了安装码校验时必填，见 NAS 日志中的 first-run setup code。</p></div>
      <p class="error" id="setup-error" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">完成设置并继续</button>
    </form>

    <form id="form-login" hidden autocomplete="off">
      <h2 class="auth-card__title">登录</h2>
      <div class="field"><label class="field__label" for="login-password">管理密码</label>
        <input class="input" id="login-password" type="password" maxlength="128" required></div>
      <label class="checkbox"><input type="checkbox" id="login-remember"><span>30 天内保持登录</span></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">登录</button>
    </form>

    <div id="auth-loading" class="auth-card__loading">
      <div class="skeleton"></div><div class="skeleton" style="width:70%"></div>
    </div>
  </div>
</section>

<script type="module" src="/next/js/main.js"></script>
</body>
</html>
