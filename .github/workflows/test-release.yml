name: Test Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish test FPK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26.x"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' apps/fnos-nas-agent/manifest | head -n 1 | xargs)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || { echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2; exit 1; }
          test "$manifest_version" = "$tag_version" || { echo "Tag $GITHUB_REF_NAME does not match fnOS manifest version $manifest_version" >&2; exit 1; }
          test "$tag_version" = "0.2.2" || { echo "This workflow currently only permits the initial test release 0.2.2" >&2; exit 1; }

      - name: Run test suite
        run: npm test

      - name: Run release safety gates
        run: npm run check:release

      - name: Stage native FPK
        shell: bash
        run: |
          set -euo pipefail
          source_app="apps/fnos-nas-agent"
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a "$source_app/." "$stage/"
          mkdir -p "$stage/app/bin"
          install -m 0755 "$(command -v node)" "$stage/app/bin/node"
          test "$("$stage/app/bin/node" --version)" = "$(node --version)"
          python3 scripts/generate-fpk-icons.py "$stage"
          test -s "$stage/app/server.mjs"
          test -x "$stage/app/bin/node"
          test -s "$stage/ICON.PNG"
          test -s "$stage/ICON_256.PNG"
          python3 -c 'import json, pathlib, sys; p=pathlib.Path(sys.argv[1]); json.loads((p/"config/privilege").read_text()); json.loads((p/"config/resource").read_text()); assert (p/"app"/"ui"/"config").is_file(); assert (p/"wizard").is_dir()' "$stage"

      - name: Smoke test bundled runtime and FPK lifecycle
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          data="$RUNNER_TEMP/fnos-nas-agent-lifecycle-smoke"
          error_log="$RUNNER_TEMP/fnos-nas-agent-lifecycle-error.log"
          rm -rf "$data"
          mkdir -p "$data"
          run_lifecycle() {
            TRIM_APPDEST="$stage/app" TRIM_PKGVAR="$data" TRIM_SERVICE_PORT=0 TRIM_TEMP_LOGFILE="$error_log" bash "$stage/cmd/main" "$1"
          }
          cleanup() { run_lifecycle stop >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          run_lifecycle start
          pid="$(cat "$data/agent.pid")"
          test -n "$pid"
          run_lifecycle status
          run_lifecycle start
          test "$(cat "$data/agent.pid")" = "$pid"
          run_lifecycle stop
          test ! -e "$data/agent.pid"
          set +e
          run_lifecycle status
          status=$?
          set -e
          test "$status" -eq 3

      - name: Install verified fnpack
        shell: bash
        run: |
          set -euo pipefail
          fnpack_url="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          fnpack_sha256="54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 "$fnpack_url" --output "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' "$fnpack_sha256" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/fnpack"
          "$RUNNER_TEMP/fnpack" --help

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          (
            cd "$stage"
            "$RUNNER_TEMP/fnpack" build
          )
          shopt -s nullglob
          artifacts=("$stage"/*.fpk)
          test "${#artifacts[@]}" -eq 1
          mkdir -p dist
          artifact="dist/fnos-nas-agent-0.2.2-x86.fpk"
          install -m 0644 "${artifacts[0]}" "$artifact"
          node scripts/verify-fpk-artifact.mjs "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          node scripts/create-release-manifest.mjs "$artifact" dist/release-manifest.json
          node scripts/verify-release-artifact.mjs "$artifact" "$artifact.sha256" dist/release-manifest.json

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/fnos-nas-agent-0.2.2-x86.fpk \
            dist/fnos-nas-agent-0.2.2-x86.fpk.sha256 \
            dist/release-manifest.json \
            --title "fnOS NAS Agent 0.2.2 — First Test Release" \
            --prerelease \
            --notes "First test release for staging validation. This is an unsigned test build, not a production-certified release. Verify the SHA-256 checksum and manifest before use. Install only on a test fnOS NAS; validate fresh install, upgrade, restart, rollback and uninstall before production use."
