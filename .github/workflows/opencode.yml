name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    name: Run OpenCode for /oc requests
    if: |
      github.event.comment.user.type != 'Bot' && (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26.x"

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Configure git identity
        run: |
          git config user.name "opencode-agent"
          git config user.email "opencode-agent@users.noreply.github.com"

      - name: Run OpenCode
        env:
          # Add one provider key as a repository secret; keep OPENCODE_MODEL in sync with it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: ${{ github.event.comment.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/opencode"
          opencode run --standalone --auto \
            --model "${{ vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-5-5' }}" \
            "$PROMPT

          If you changed files, commit them to a new branch and open a pull request that explains the change." \
            | tee "$RUNNER_TEMP/opencode/reply.txt" || true

      - name: Post reply on the thread
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          file="$RUNNER_TEMP/opencode/reply.txt"
          if [ -f "$file" ]; then body="$(head -c 60000 "$file")"; else body=""; fi
          if [ -z "$body" ]; then body="OpenCode finished without output. See the workflow log."; fi
          gh api "repos/$REPO/issues/$ISSUE/comments" -f body="$body"
