name: Build fnOS FPK

on:
  push:
    branches:
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "phase-9/**"
      - "phase-10/**"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/build-fpk.yml"
  pull_request:
    branches:
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/build-fpk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.x", "26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          # Node 26 is the default packaged runtime; Node 24 remains a test-only regression line.
          node-version: ${{ matrix.node-version }}

      - name: Show Node.js runtime version
        run: node --version

      - name: Run core tests
        run: npm test

      - name: Validate app scripts and entry syntax
        shell: bash
        run: |
          set -euo pipefail
          app="apps/fnos-nas-agent"
          test -s "$app/app/server.mjs"
          for script in "$app"/cmd/*; do
            test -f "$script"
            bash -n "$script"
          done
          node --check "$app/app/server.mjs"
          node --check "$app/app/skills.mjs"
          node --check "$app/app/skill-archives.mjs"
          node --check "$app/app/read-only-tools.mjs"
          node --check "$app/app/model-adapter.mjs"
          node --check "$app/app/agent-core.mjs"
          node --check "$app/app/task-manager.mjs"
          node --check "$app/app/permission-policy.mjs"

      - name: Prepare app payload and icons
        if: matrix.node-version == '26.x'
        shell: bash
        run: |
          set -euo pipefail
          app="apps/fnos-nas-agent"
          mkdir -p "$app/app/bin"
          cp "$(command -v node)" "$app/app/bin/node"
          chmod 755 "$app/app/bin/node"
          python3 scripts/generate-fpk-icons.py "$app"

          test -s "$app/config/privilege"
          test -s "$app/config/resource"
          test -d "$app/wizard"
          python3 -m json.tool "$app/config/privilege" >/dev/null
          python3 -m json.tool "$app/config/resource" >/dev/null

          for script in "$app"/cmd/*; do chmod 755 "$script"; done
          test -x "$app/cmd/main"
          test -x "$app/cmd/install_init"
          test -x "$app/cmd/install_callback"
          test -x "$app/cmd/uninstall_init"
          test -x "$app/cmd/uninstall_callback"
          test -x "$app/cmd/upgrade_init"
          test -x "$app/cmd/upgrade_callback"
          test -x "$app/cmd/config_init"
          test -x "$app/cmd/config_callback"
          "$app/app/bin/node" --version
          "$app/app/bin/node" --check "$app/app/server.mjs"

      - name: Download and verify official fnpack
        if: matrix.node-version == '26.x'
        shell: bash
        run: |
          set -euo pipefail
          url="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          expected="54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/fnpack"
          "$RUNNER_TEMP/fnpack" --help

      - name: Build FPK
        if: matrix.node-version == '26.x'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/fnos-nas-agent
          "$RUNNER_TEMP/fnpack" build
          shopt -s nullglob
          packages=(./*.fpk)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "fnpack did not produce an FPK file" >&2
            exit 1
          fi
          mkdir -p ../../dist
          cp "${packages[0]}" ../../dist/fnos-nas-agent-test.fpk

      - name: Inspect package and checksum
        if: matrix.node-version == '26.x'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/fnos-nas-agent-test.fpk
          sha256sum dist/fnos-nas-agent-test.fpk | tee dist/fnos-nas-agent-test.fpk.sha256
          file dist/fnos-nas-agent-test.fpk
          tar -tzf dist/fnos-nas-agent-test.fpk > dist/fpk-contents.txt
          grep -qx "manifest" dist/fpk-contents.txt
          grep -q "app.tgz" dist/fpk-contents.txt
          grep -q "cmd/main" dist/fpk-contents.txt
          ls -lh dist/fnos-nas-agent-test.fpk*

      - name: Upload Node.js 26 test FPK
        if: matrix.node-version == '26.x'
        uses: actions/upload-artifact@v4
        with:
          name: fnos-nas-agent-test-fpk-node-26.x
          path: |
            dist/fnos-nas-agent-test.fpk
            dist/fnos-nas-agent-test.fpk.sha256
          if-no-files-found: error
          retention-days: 14
