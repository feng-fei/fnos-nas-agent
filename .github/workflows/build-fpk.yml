name: Build fnOS FPK

on:
  push:
    branches:
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "phase-9/**"
      - "phase-10/**"
      - "phase-11/**"
      - "phase-12/**"
      - "phase-13/**"
      - "phase-14/**"
      - "phase-15/**"
      - "phase-16/**"
      - "phase-17/**"
      - "phase-18/**"
      - "phase-19/**"
      - "phase-20/**"
      - "phase-20-*"
      - "phase-21/**"
      - "phase-21-*"
      - "phase-22/**"
      - "phase-22-*"
      - "phase-23/**"
      - "phase-23-*"
      - "phase-24/**"
      - "phase-24-*"
      - "phase-25/**"
      - "phase-25-*"
      - "phase-26/**"
      - "phase-26-*"
      - "phase-27/**"
      - "phase-27-*"
      - "phase-28/**"
      - "phase-28-*"
      - "feature/**"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/phase-25-release-manifest-and-provenance.md"
      - "docs/phase-26-release-artifact-verification.md"
      - "docs/phase-27-build-provenance-attestation.md"
      - ".github/workflows/build-fpk.yml"
  pull_request:
    branches:
      - main
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "phase-9/**"
      - "phase-10/**"
      - "phase-11/**"
      - "phase-12/**"
      - "phase-13/**"
      - "phase-14/**"
      - "phase-15/**"
      - "phase-16/**"
      - "phase-17/**"
      - "phase-18/**"
      - "phase-19/**"
      - "phase-20/**"
      - "phase-24/**"
      - "phase-24-*"
      - "phase-25/**"
      - "phase-25-*"
      - "phase-26/**"
      - "phase-26-*"
      - "phase-27/**"
      - "phase-27-*"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/phase-25-release-manifest-and-provenance.md"
      - "docs/phase-26-release-artifact-verification.md"
      - "docs/phase-27-build-provenance-attestation.md"
      - ".github/workflows/build-fpk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Core tests and syntax (Node 26.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node-version: ["26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          # Node 26 is the sole supported development and test runtime.
          node-version: ${{ matrix.node-version }}

      - name: Show Node.js runtime version
        run: node --version

      - name: Run core tests
        run: npm test

      - name: Validate app scripts and entry syntax
        shell: bash
        run: |
          set -euo pipefail
          app="apps/fnos-nas-agent"
          test -s "$app/app/server.mjs"
          for script in "$app"/cmd/*; do
            test -f "$script"
            bash -n "$script"
          done
          node --check "$app/app/server.mjs"
          node --check "$app/app/skills.mjs"
          node --check "$app/app/skill-archives.mjs"
          node --check "$app/app/read-only-tools.mjs"
          node --check "$app/app/trim-cli-adapter.mjs"
          node --check "$app/app/model-adapter.mjs"
          node --check "$app/app/agent-core.mjs"
          node --check "$app/app/task-manager.mjs"
          node --check "$app/app/audit-log.mjs"
          python3 -c 'import re, pathlib; s=pathlib.Path("apps/fnos-nas-agent/app/ui/index.html").read_text(); m=re.search(r"<script>(.*?)</script>", s, re.S); assert m, "inline UI script not found"; pathlib.Path("/tmp/fnos-agent-ui-check.mjs").write_text(m.group(1))'
          node --check /tmp/fnos-agent-ui-check.mjs
          node --check "$app/app/permission-policy.mjs"
          node --check "$app/app/skill-manifest.mjs"
          node --check "$app/app/request-limiter.mjs"
          node --check "$app/app/approval-ledger.mjs"
          node --check scripts/verify-fpk-artifact.mjs
          node --check scripts/create-release-manifest.mjs
          node --check scripts/verify-release-artifact.mjs
