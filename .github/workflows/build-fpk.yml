name: Build fnOS FPK

on:
  push:
    branches:
      - main
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "phase-9/**"
      - "phase-10/**"
      - "phase-11/**"
      - "phase-12/**"
      - "phase-13/**"
      - "phase-14/**"
      - "phase-15/**"
      - "phase-16/**"
      - "phase-17/**"
      - "phase-18/**"
      - "phase-19/**"
      - "phase-20/**"
      - "phase-20-*"
      - "phase-21/**"
      - "phase-21-*"
      - "phase-22/**"
      - "phase-22-*"
      - "phase-23/**"
      - "phase-23-*"
      - "phase-24/**"
      - "phase-24-*"
      - "phase-25/**"
      - "phase-25-*"
      - "phase-26/**"
      - "phase-26-*"
      - "phase-27/**"
      - "phase-27-*"
      - "phase-28/**"
      - "phase-28-*"
      - "feature/**"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/phase-25-release-manifest-and-provenance.md"
      - "docs/phase-26-release-artifact-verification.md"
      - "docs/phase-27-build-provenance-attestation.md"
      - "docs/phase-114-build-provenance-attestation.md"
      - "docs/phase-116-attestation-verification.md"
      - "docs/phase-123-fpk-bundled-runtime-smoke.md"
      - ".github/workflows/build-fpk.yml"
  pull_request:
    branches:
      - main
      - phase-2/fpk-packaging
      - "phase-2/**"
      - "phase-3/**"
      - "phase-5/**"
      - "phase-6/**"
      - "phase-7/**"
      - "phase-8/**"
      - "phase-9/**"
      - "phase-10/**"
      - "phase-11/**"
      - "phase-12/**"
      - "phase-13/**"
      - "phase-14/**"
      - "phase-15/**"
      - "phase-16/**"
      - "phase-17/**"
      - "phase-18/**"
      - "phase-19/**"
      - "phase-20/**"
      - "phase-24/**"
      - "phase-24-*"
      - "phase-25/**"
      - "phase-25-*"
      - "phase-26/**"
      - "phase-26-*"
      - "phase-27/**"
      - "phase-27-*"
      - "fix/**"
      - "test/**"
    paths:
      - "apps/fnos-nas-agent/**"
      - "scripts/generate-fpk-icons.py"
      - "package.json"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/phase-25-release-manifest-and-provenance.md"
      - "docs/phase-26-release-artifact-verification.md"
      - "docs/phase-27-build-provenance-attestation.md"
      - "docs/phase-114-build-provenance-attestation.md"
      - "docs/phase-116-attestation-verification.md"
      - "docs/phase-123-fpk-bundled-runtime-smoke.md"
      - ".github/workflows/build-fpk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Core tests and syntax (Node 26.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node-version: ["26.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Node 26 is the sole supported development and test runtime.
          node-version: ${{ matrix.node-version }}

      - name: Show Node.js runtime version
        run: node --version

      - name: Run core tests
        run: npm test

      - name: Run release safety invariants
        run: npm run check:release

      - name: Validate app scripts and entry syntax
        shell: bash
        run: |
          set -euo pipefail
          app="apps/fnos-nas-agent"
          test -s "$app/app/server.mjs"
          for script in "$app"/cmd/*; do
            test -f "$script"
            bash -n "$script"
          done
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$app/app" -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find scripts -type f -name '*.mjs' -print0)
          python3 -c 'import re, pathlib; s=pathlib.Path("apps/fnos-nas-agent/app/ui/index.html").read_text(); m=re.search(r"<script>(.*?)</script>", s, re.S); assert m, "inline UI script not found"; pathlib.Path("/tmp/fnos-agent-ui-check.mjs").write_text(m.group(1))'
          node --check /tmp/fnos-agent-ui-check.mjs

      
      - name: Stage native FPK
        shell: bash
        run: |
          set -euo pipefail
          source_app="apps/fnos-nas-agent"
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a "$source_app/." "$stage/"
          mkdir -p "$stage/app/bin"
          install -m 0755 "$(command -v node)" "$stage/app/bin/node"
          test "$("$stage/app/bin/node" --version)" = "$(node --version)"
          python3 scripts/generate-fpk-icons.py "$stage"
          test -s "$stage/app/server.mjs"
          test -x "$stage/app/bin/node"
          test -s "$stage/ICON.PNG"
          test -s "$stage/ICON_256.PNG"
          python3 -c 'import json, pathlib, sys; p=pathlib.Path(sys.argv[1]); json.loads((p/"config/privilege").read_text()); json.loads((p/"config/resource").read_text()); assert (p/"app"/"ui"/"config").is_file(); assert (p/"wizard").is_dir()' "$stage"

      - name: Smoke test bundled runtime and FPK lifecycle
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          data="$RUNNER_TEMP/fnos-nas-agent-lifecycle-smoke"
          error_log="$RUNNER_TEMP/fnos-nas-agent-lifecycle-error.log"
          rm -rf "$data"
          mkdir -p "$data"
          run_lifecycle() {
            TRIM_APPDEST="$stage/app" \
            TRIM_PKGVAR="$data" \
            TRIM_SERVICE_PORT=0 \
            TRIM_TEMP_LOGFILE="$error_log" \
            bash "$stage/cmd/main" "$1"
          }
          cleanup() {
            run_lifecycle stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          run_lifecycle start
          pid="$(cat "$data/agent.pid")"
          test -n "$pid"
          run_lifecycle status
          run_lifecycle start
          test "$(cat "$data/agent.pid")" = "$pid"
          run_lifecycle stop
          test ! -e "$data/agent.pid"
          set +e
          run_lifecycle status
          status=$?
          set -e
          test "$status" -eq 3

      - name: Install verified fnpack
        shell: bash
        run: |
          set -euo pipefail
          fnpack_url="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          fnpack_sha256="54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 "$fnpack_url" --output "$RUNNER_TEMP/fnpack"
          printf '%s  %s\n' "$fnpack_sha256" "$RUNNER_TEMP/fnpack" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/fnpack"
          "$RUNNER_TEMP/fnpack" --help

      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fnos-nas-agent-fpk"
          (
            cd "$stage"
            "$RUNNER_TEMP/fnpack" build
          )
          shopt -s nullglob
          artifacts=("$stage"/*.fpk)
          artifact_count=${#artifacts[@]}
          if [ "$artifact_count" -ne 1 ]; then
            printf 'Expected exactly one FPK output; found %s\n' "$artifact_count" >&2
            find "$stage" -maxdepth 2 -type f -name '*.fpk' -print >&2
            exit 1
          fi
          mkdir -p dist
          install -m 0644 "${artifacts[0]}" dist/fnos-nas-agent-test-node-26.fpk

      - name: Inspect package and checksum
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/fnos-nas-agent-test-node-26.fpk"
          test -s "$artifact"
          node scripts/verify-fpk-artifact.mjs "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          node scripts/create-release-manifest.mjs "$artifact" dist/release-manifest.json
          node scripts/verify-release-artifact.mjs "$artifact" "$artifact.sha256" dist/release-manifest.json

      - name: Upload test FPK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fnos-nas-agent-test-fpk-node-26.x
          path: |
            dist/fnos-nas-agent-test-node-26.fpk
            dist/fnos-nas-agent-test-node-26.fpk.sha256
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  
  attest:
    name: Attest verified FPK (main only)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26.x"

      - name: Download test FPK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fnos-nas-agent-test-fpk-node-26.x
          path: artifact

      - name: Verify artifact bundle before attestation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-artifact.mjs \
            artifact/fnos-nas-agent-test-node-26.fpk \
            artifact/fnos-nas-agent-test-node-26.fpk.sha256 \
            artifact/release-manifest.json

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifact/fnos-nas-agent-test-node-26.fpk

      - name: Verify generated provenance attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            artifact/fnos-nas-agent-test-node-26.fpk \
            --repo feng-fei/fnos-nas-agent \
            --signer-workflow feng-fei/fnos-nas-agent/.github/workflows/build-fpk.yml \
            --source-ref refs/heads/main
