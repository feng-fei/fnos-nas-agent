<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>fnOS NAS Agent</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;background:Canvas;color:CanvasText}main{max-width:680px;margin:0 auto;padding:24px 16px}.panel{border:1px solid #8885;border-radius:14px;padding:16px;margin:14px 0}.muted{opacity:.72}.status{font-weight:650}button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #8888;background:ButtonFace;color:ButtonText}
</style></head><body><main><h1>fnOS NAS Agent</h1><p class="muted">轻量 NAS 助手 · 第二阶段骨架</p>
<section class="panel"><h2>服务状态</h2><p id="status" class="status">正在检查…</p><p id="detail" class="muted">当前版本仅提供状态接口，不会执行 NAS 操作。</p><button id="refresh" type="button">刷新状态</button></section>
<section class="panel"><h2>能力清单</h2><p id="tools" class="muted">初始版本未启用任何 NAS 工具。</p></section></main>
<script>
const statusEl=document.querySelector("#status"),detailEl=document.querySelector("#detail"),toolsEl=document.querySelector("#tools");
async function refresh(){statusEl.textContent="正在检查…";try{const r=await fetch("/api/health",{cache:"no-store"});if(!r.ok)throw Error();const h=await r.json();statusEl.textContent=h.ok?"运行正常":"状态异常";detailEl.textContent="版本 "+h.version+"；执行能力："+(h.executionEnabled?"已启用":"关闭");const tr=await fetch("/api/tools",{cache:"no-store"});if(tr.status===401)toolsEl.textContent="需要访问令牌；请使用已授权的客户端。";else if(!tr.ok)toolsEl.textContent="暂时无法读取能力清单。";else{const d=await tr.json();toolsEl.textContent=d.tools.length?d.tools.map(t=>t.name+"（"+t.risk+"）").join("、"):"尚无已注册工具。";}}catch{statusEl.textContent="无法连接服务";detailEl.textContent="请检查服务是否启动以及访问地址是否正确。";toolsEl.textContent="能力清单不可用。";}}
document.querySelector("#refresh").addEventListener("click",refresh);refresh();
</script></body></html>
